name: conspect
version: 5.1
author: AI
display_name: Conspect 数据报表引擎
description: 多源数据智能分析与专业报表生成工具。上传 Excel/CSV 数据源，AI 走「读取数据 → 分析数据 → 汇报内容选型 → 报表选型 → 生成报表」五阶段流程：先摸清数据、再算出结论、再定「讲什么」、再定「长什么样」、最后出报表。内置 38 种报表风格资产（6 族）与 22 个报表板块，两个选型环节各有一次用户确认。适用场景：经营分析、周报月报、数据看板、投屏报表、多表合并分析、Excel 出图。不适用：桌面 BI 集成、实时数据接入、纯文本报告、原始数据在线编辑。
language: zh-CN
tags:
  - 数据分析
  - 报表生成
  - 数据可视化
  - 风格资产
  - ECharts
  - 全流程托管

assets:
  style_system: assets/style-system.json
  style_count: 38
  family_count: 6
  block_count: 22
  catalog: assets/catalog/catalog_l0.md
  load_protocol: "L0 目录 → L1 族索引 → L2 单份正文"

phases:
  - 读取数据
  - 分析数据
  - 汇报内容选型
  - 报表选型
  - 生成报表
confirm_points:
  - _cs-content.md
  - _cs-style.md

checks:
  style_assets: python tools/check_style_assets.py
  refs: python tools/check_refs.py
  tests: python -m unittest discover -s tests
