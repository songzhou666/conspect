# conspect 分块索引
# 按激活频率分级，控制上下文大小

always_load:
  - chunk-01-overview  # 概览与触发（始终加载）

high_frequency:
  - chunk-02-workflow  # 核心工作流

medium_frequency:
  - chunk-03-data-pipeline  # 数据流水线
  - chunk-04-rendering      # 渲染引擎
  - references/output-spec   # 输出规范
  - references/trigger-guide # 触发机制
  - references/cli-ai-workflow # CLI和AI协作

low_frequency:
  - chunk-05-quality        # 质量审核体系
  - references/examples     # 使用示例
  - references/quality-audit # 质量审核机制
  - references/ai-reviewer   # AI审核Agent
  - references/agent-communication # Agent通信
  - references/chart-selection # 图表选型

chunk_rules:
  max_active_chunks: 5
  load_on_demand: true
  auto_unload: true
